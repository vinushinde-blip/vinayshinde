name: Scan Nifty 500 Pullback Pattern

on:
  workflow_dispatch:
    inputs:
      charts:
        description: "Also render annotated PNG charts for each match"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh Nifty 500 constituent list
        run: python scripts/fetch_nifty500_list.py

      - name: Run pattern scanner
        run: |
          if [ "${{ inputs.charts }}" = "true" ]; then
            python scripts/pattern_scanner.py --charts
          else
            python scripts/pattern_scanner.py
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nifty500_list.csv data/pattern_scan_results.csv data/charts
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update Nifty 500 pattern scan results"
          git push
