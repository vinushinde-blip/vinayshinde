name: Fetch GOLDBEES/NIFTYBEES OHLC

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance openpyxl pandas

      - name: Fetch data
        run: python scripts/fetch_ohlc.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/goldbees_niftybees_ohlc_10y.xlsx
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update GOLDBEES/NIFTYBEES OHLC data"
          git push
